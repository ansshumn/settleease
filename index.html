  <script>
    // Patch Node.prototype.removeChild & insertBefore to prevent browser extensions / Google Translate from crashing React DOM reconciliation
    if (typeof Node !== 'undefined' && Node.prototype) {
      const originalRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function (child) {
        if (child && child.parentNode !== this) {
          if (console) console.warn('Cannot remove child, parent mismatch avoided.');
          return child;
        }
        return originalRemoveChild.apply(this, arguments);
      };

      const originalInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function (newNode, referenceNode) {
        if (referenceNode && referenceNode.parentNode !== this) {
          if (console) console.warn('Cannot insertBefore, parent mismatch avoided.');
          return newNode;
        }
        return originalInsertBefore.apply(this, arguments);
      };
    }

    // Ignore benign DOM reconciliation errors from destroying the UI
    window.addEventListener('error', function (e) {
      if (e.message && (e.message.includes('removeChild') || e.message.includes('insertBefore'))) {
        e.preventDefault();
        return true;
      }
    });
  </script>
